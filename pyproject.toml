[project]
name = "nightshift"
version = "0.2.0"
description = "Local control plane for unattended overnight work in isolated git clones."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nightshift = "nightshift.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
