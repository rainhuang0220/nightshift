# Copy to config/nightshift.toml to override defaults.
# Job isolation defaults to an independent clone. The optional worktree
# backend shares source git metadata and is not the unattended default.
# See docs/job-format.md.
# Paths are relative to the Nightshift root (the process working directory,
# or the directory passed as --root). Do not put secrets in this file.

schema_version = 1

[paths]
state_dir = "state"
runs_dir = "runs"
worktrees_dir = "worktrees"

[supervisor]
concurrency = 1
poll_interval_seconds = 2

[provider]
default = "grok"
max_turns = 40
# dontAsk plus explicit allow/deny rules. bypassPermissions is refused.
permission_mode = "dontAsk"

[policy]
# Failed and cancelled worktrees are kept unless this is true.
destroy_failed_worktrees = false

# Optional toolchain directories the provider may read in addition to the
# isolated workspace, the run directory, and required system paths. Relative
# paths resolve from the Nightshift root. The operator home is refused.
# A job prompt cannot add roots. Leave this unset unless a compiler or SDK
# lives outside the default system roots.
# [containment]
# read_roots = ["relative/toolchain"]
